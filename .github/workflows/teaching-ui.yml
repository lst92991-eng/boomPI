name: teaching-ui
on:
  push:
    branches: [codex/minimal-non-audio]
  pull_request:
permissions:
  contents: read
concurrency:
  group: teaching-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: lvgl/lvgl
          ref: 0b5a1d4b23975b920ff841ea9cd038802f51711b
          path: build-deps/lvgl
      - name: Check frozen audio and server
        run: |
          git diff --exit-code 2ca0cf63d241a032292f4d83a3120002b91a066e -- client/src/audio client/include/boompi/audio client/include/boompi/platform client/src/platform/rv1106/audio* client/src/platform/rv1106/board_voice_profile.h client/src/platform/rv1106/rockchip_3a.cpp client/src/platform/rv1106/vad.* client/src/platform/rv1106/wake.* server protocol third_party client/assets
      - name: Install UI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 libsdl2-dev libfreetype6-dev libasound2-dev libswresample-dev libavutil-dev libboost-dev libcjson-dev libssl-dev fonts-noto-cjk
      - name: Build and test original committed sources
        run: |
          cmake --preset host-debug -DBOOMPI_BUILD_UI_SIMULATOR=ON -DBOOMPI_LVGL_ROOT="$GITHUB_WORKSPACE/build-deps/lvgl" -DBOOMPI_REQUIRE_HOST_TRANSPORT_TEST=ON
          cmake --build --preset host-debug --parallel 4
          ctest --preset host-debug
      - name: Ethernet and Wi-Fi order in an isolated network namespace
        run: |
          sudo ip netns add boompi-teaching
          trap 'sudo ip netns del boompi-teaching' EXIT
          sudo ip -n boompi-teaching link add eth0 type dummy
          sudo ip -n boompi-teaching link add wlan0 type dummy
          sudo ip -n boompi-teaching addr add 192.0.2.2/24 dev eth0
          sudo ip -n boompi-teaching addr add 198.51.100.2/24 dev wlan0
          sudo ip -n boompi-teaching link set eth0 up
          sudo ip -n boompi-teaching link set wlan0 up
          sudo ip netns exec boompi-teaching "$GITHUB_WORKSPACE/build/host-debug/client/boompi_network_interface_test" eth0
          sudo ip netns exec boompi-teaching "$GITHUB_WORKSPACE/build/host-debug/client/boompi_network_interface_test" wlan0 prefer
          sudo ip -n boompi-teaching link set eth0 down
          sudo ip netns exec boompi-teaching "$GITHUB_WORKSPACE/build/host-debug/client/boompi_network_interface_test" wlan0
      - name: Render the real two-page UI
        run: |
          mkdir -p /tmp/teaching-results
          build/host-debug/client/boompi_ui_page_test /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc /tmp/teaching-results
      - name: Sanitized UI and camera regression
        run: |
          cmake -S . -B build/teaching-sanitized -DBOOMPI_BUILD_UI_SIMULATOR=ON -DBOOMPI_LVGL_ROOT="$GITHUB_WORKSPACE/build-deps/lvgl" -DBOOMPI_TARGET_RV1106=OFF -DBOOMPI_BUILD_TESTS=ON -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/teaching-sanitized --target boompi_ui_page_test boompi_camera_lifecycle_test boompi_network_interface_test --parallel 4
          ctest --test-dir build/teaching-sanitized -R 'ui-pages|camera-lifecycle|network-interface-contract' --output-on-failure
      - name: Record measured counts and formatting diff
        if: always()
        run: |
          mkdir -p /tmp/teaching-results
          python3 scripts/measure_client.py > /tmp/teaching-results/client-metrics.json
          git diff --name-only --diff-filter=ACMR 2ca0cf63d241a032292f4d83a3120002b91a066e -- '*.cpp' '*.h' | xargs -r clang-format-18 -i
          git diff --binary > /tmp/teaching-results/format.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teaching-validation
          path: /tmp/teaching-results/
          retention-days: 3
