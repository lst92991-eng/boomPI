name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest

    env:
      CGO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Report tool versions
        run: |
          cmake --version
          python --version
          go version

      - name: Install Linux host test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libboost-dev libcjson-dev libssl-dev libasound2-dev libswresample-dev libavutil-dev pkg-config

      - name: Validate protocol fixtures
        run: python scripts/verify_protocol_fixtures.py

      - name: Run Python checks
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Configure C++ host tests (Linux, transport required)
        if: runner.os == 'Linux'
        run: cmake --preset host-debug -DBOOMPI_REQUIRE_HOST_TRANSPORT_TEST=ON

      - name: Configure C++ host tests
        if: runner.os != 'Linux'
        run: cmake --preset host-debug

      - name: Build C++ host tests
        run: cmake --build --preset host-debug --parallel

      - name: Run C++ host tests
        run: ctest --preset host-debug

      - name: Run Go tests
        working-directory: server
        run: go test ./...

      - name: Run Go vet
        working-directory: server
        run: go vet ./...

      - name: Run Linux race and C++ WSS integration tests
        if: runner.os == 'Linux'
        working-directory: server
        env:
          CGO_ENABLED: "1"
          BOOMPI_CPP_WSS_SMOKE: ${{ github.workspace }}/build/host-debug/client/boompi_voice_transport_loopback_test
        run: go test -race ./...

      - name: Build Go server
        working-directory: server
        run: go build -trimpath ./cmd/boompi-server
