name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    env:
      CGO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Report tool versions
        run: |
          cmake --version
          python --version
          go version

      - name: Validate protocol fixtures
        run: python scripts/verify_protocol_fixtures.py

      - name: Validate audio vendor dependency gates
        run: python -m unittest scripts.tests.test_audio_vendor_cmake -v

      - name: Validate client source and documentation contracts
        run: python -m unittest scripts.tests.test_client_source_contract -v

      - name: Validate POSIX P0 probes
        if: runner.os != 'Windows'
        run: |
          sh -n scripts/probes/rv1106_p0_probe.sh
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Run Go tests
        working-directory: server
        run: go test ./...

      - name: Run Go vet
        working-directory: server
        run: go vet ./...

      - name: Build Go server
        working-directory: server
        run: go build -trimpath ./cmd/boompi-server
